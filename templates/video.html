<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>铁板神数 · 视频演算</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<main>
  <header><div><h1>铁板神数</h1><p>按视频，一步一步算。</p></div><a href="https://www.youtube.com/watch?v=o3mkGBcPkrI" target="_blank" rel="noreferrer">原视频 ↗</a></header>
  <form id="video-form">
    <div class="form-top"><label>输入方式<select id="input-mode"><option value="date">出生日期</option><option value="pillars">四柱</option></select></label><button id="video-example" type="button" class="secondary">视频例子</button></div>
    <div id="date-inputs" class="grid"><label>出生日期<input id="video-date" type="date" min="1900-01-01" max="2099-12-31"></label><label>出生时刻<input id="video-time" type="time" value="12:00"></label></div>
    <div id="pillar-inputs" class="grid four" hidden><label>年柱<input id="year" maxlength="2" placeholder="乙巳"></label><label>月柱<input id="month" maxlength="2" placeholder="辛巳"></label><label>日柱<input id="day" maxlength="2" placeholder="甲申"></label><label>时柱<input id="time" maxlength="2" placeholder="丙子"></label></div>
    <div class="grid"><label>父亲生肖<select id="father-animal"><option value="">不填</option></select></label><label>母亲生肖<select id="mother-animal"><option value="">不填</option></select></label></div>
    <div class="grid"><label>演算基数<input id="basis-number" type="number" min="1001" max="9999" placeholder="可先查候选，如9003"></label><label>运柱<input id="fortune-pillar" maxlength="2" placeholder="可选，如壬午"></label></div>
    <button id="video-run" class="primary">开始演算</button><p id="video-error" role="alert" hidden></p>
  </form>
  <section id="video-result" aria-live="polite" hidden>
    <h2>演算过程</h2>
    <section class="part"><h3>1 · 考刻</h3><div id="video-summary"></div><div id="video-candidates"></div><div id="video-parents"></div></section>
    <section class="part"><h3>2 · 四柱取数</h3><div id="video-articles" class="table-wrap"></div></section>
    <section class="part"><h3>3 · 继续推算</h3><div id="video-next"></div></section>
    <details class="part"><summary>视频配数表</summary><div id="video-tables"></div></details>
  </section>
  <footer>日期按当地民用时间换算，23点换日；可直接填写四柱。<br>条文暂用现有对照库，不影响数值演算。</footer>
</main>
<script src="/static/js/video.js" defer></script>
</body>
</html>
